[project]
name = "graphnli-axb"
version = "0.1.0"
description = "Graph/Transformer architectures for AX-b-style broad-coverage NLI diagnostics."
authors = [{ name = "Antonio Santos" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "tqdm>=4.66",
  "nltk>=3.8",
  "tiktoken (>=0.14.0,<0.15.0)",
  "autorank (>=1.3.0,<2.0.0)",
]

[project.scripts]
graphnli-train = "graphnli_axb.train:main"

[tool.poetry]
packages = [{ include = "graphnli_axb", from = "src" }]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
wiktionary-dump = [
    "wiktextract @ file:///Users/antonio/Desktop/repositorios/GraphNLI-AXb/data/tools/wiktextract"
]
