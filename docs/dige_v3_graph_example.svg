<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 14px Arial, sans-serif; fill: #42526a; }
      .label { font: 13px Arial, sans-serif; fill: #172033; }
      .small { font: 12px Arial, sans-serif; fill: #42526a; }
      .edge { stroke: #8a94a6; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-soft { stroke: #b7beca; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-soft); }
      .identity { stroke: #2f80ed; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .scope { stroke: #eb5757; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); }
      .temporal { stroke: #9b51e0; stroke-width: 2.5; fill: none; marker-end: url(#arrow-purple); }
      .premise { fill: #e8f1ff; stroke: #2f80ed; stroke-width: 2; }
      .hypothesis { fill: #e9f8ef; stroke: #27ae60; stroke-width: 2; }
      .logic { fill: #fff1f0; stroke: #eb5757; stroke-width: 2; }
      .temporal-node { fill: #f4ecff; stroke: #9b51e0; stroke-width: 2; }
      .panel { fill: #fbfcfe; stroke: #d8dee9; stroke-width: 1.5; rx: 10; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a94a6" />
    </marker>
    <marker id="arrow-soft" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b7beca" />
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f80ed" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#eb5757" />
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#9b51e0" />
    </marker>
  </defs>

  <rect x="20" y="20" width="1140" height="720" fill="#ffffff" rx="14"/>
  <text x="50" y="62" class="title">DiGE-NLI v3: Example Logic-Scope Evidence Graph</text>
  <text x="50" y="90" class="subtitle">Premise: “All cats sleep or play before noon.”</text>
  <text x="50" y="112" class="subtitle">Hypothesis: “Some cats do not sleep before noon.”</text>

  <rect x="50" y="145" width="1080" height="245" class="panel"/>
  <text x="72" y="178" class="label">Premise nodes</text>

  <rect x="100" y="220" width="86" height="42" class="logic" rx="8"/>
  <text x="143" y="246" text-anchor="middle" class="label">all</text>
  <text x="143" y="279" text-anchor="middle" class="small">universal</text>

  <rect x="230" y="220" width="86" height="42" class="premise" rx="8"/>
  <text x="273" y="246" text-anchor="middle" class="label">cats</text>
  <text x="273" y="279" text-anchor="middle" class="small">premise</text>

  <rect x="360" y="220" width="86" height="42" class="premise" rx="8"/>
  <text x="403" y="246" text-anchor="middle" class="label">sleep</text>
  <text x="403" y="279" text-anchor="middle" class="small">premise</text>

  <rect x="490" y="220" width="86" height="42" class="logic" rx="8"/>
  <text x="533" y="246" text-anchor="middle" class="label">or</text>
  <text x="533" y="279" text-anchor="middle" class="small">disjunction</text>

  <rect x="620" y="220" width="86" height="42" class="premise" rx="8"/>
  <text x="663" y="246" text-anchor="middle" class="label">play</text>
  <text x="663" y="279" text-anchor="middle" class="small">premise</text>

  <rect x="750" y="220" width="86" height="42" class="temporal-node" rx="8"/>
  <text x="793" y="246" text-anchor="middle" class="label">before</text>
  <text x="793" y="279" text-anchor="middle" class="small">temporal</text>

  <rect x="880" y="220" width="86" height="42" class="premise" rx="8"/>
  <text x="923" y="246" text-anchor="middle" class="label">noon</text>
  <text x="923" y="279" text-anchor="middle" class="small">premise</text>

  <path class="edge-soft" d="M186 241 C202 241 214 241 230 241"/>
  <path class="edge-soft" d="M316 241 C332 241 344 241 360 241"/>
  <path class="edge-soft" d="M446 241 C462 241 474 241 490 241"/>
  <path class="edge-soft" d="M576 241 C592 241 604 241 620 241"/>
  <path class="edge-soft" d="M706 241 C722 241 734 241 750 241"/>
  <path class="edge-soft" d="M836 241 C852 241 864 241 880 241"/>
  <path class="scope" d="M143 220 C180 170 245 170 273 220"/>
  <text x="205" y="168" class="small">universal_scope</text>
  <path class="scope" d="M533 220 C505 170 430 170 403 220"/>
  <text x="434" y="188" class="small">disjunction_scope</text>
  <path class="scope" d="M533 220 C565 170 635 170 663 220"/>
  <path class="temporal" d="M793 220 C825 170 895 170 923 220"/>
  <text x="835" y="188" class="small">temporal_order</text>

  <rect x="50" y="430" width="1080" height="245" class="panel"/>
  <text x="72" y="463" class="label">Hypothesis nodes</text>

  <rect x="160" y="505" width="86" height="42" class="logic" rx="8"/>
  <text x="203" y="531" text-anchor="middle" class="label">some</text>
  <text x="203" y="564" text-anchor="middle" class="small">quantifier</text>

  <rect x="290" y="505" width="86" height="42" class="hypothesis" rx="8"/>
  <text x="333" y="531" text-anchor="middle" class="label">cats</text>
  <text x="333" y="564" text-anchor="middle" class="small">hypothesis</text>

  <rect x="420" y="505" width="86" height="42" class="logic" rx="8"/>
  <text x="463" y="531" text-anchor="middle" class="label">not</text>
  <text x="463" y="564" text-anchor="middle" class="small">negation</text>

  <rect x="550" y="505" width="86" height="42" class="hypothesis" rx="8"/>
  <text x="593" y="531" text-anchor="middle" class="label">sleep</text>
  <text x="593" y="564" text-anchor="middle" class="small">hypothesis</text>

  <rect x="680" y="505" width="86" height="42" class="temporal-node" rx="8"/>
  <text x="723" y="531" text-anchor="middle" class="label">before</text>
  <text x="723" y="564" text-anchor="middle" class="small">temporal</text>

  <rect x="810" y="505" width="86" height="42" class="hypothesis" rx="8"/>
  <text x="853" y="531" text-anchor="middle" class="label">noon</text>
  <text x="853" y="564" text-anchor="middle" class="small">hypothesis</text>

  <path class="edge-soft" d="M246 526 C262 526 274 526 290 526"/>
  <path class="edge-soft" d="M376 526 C392 526 404 526 420 526"/>
  <path class="edge-soft" d="M506 526 C522 526 534 526 550 526"/>
  <path class="edge-soft" d="M636 526 C652 526 664 526 680 526"/>
  <path class="edge-soft" d="M766 526 C782 526 794 526 810 526"/>
  <path class="scope" d="M463 505 C495 455 565 455 593 505"/>
  <text x="493" y="473" class="small">negation_scope</text>
  <path class="temporal" d="M723 505 C755 455 825 455 853 505"/>
  <text x="760" y="473" class="small">temporal_order</text>

  <path class="identity" d="M273 262 C285 350 318 410 333 505"/>
  <text x="305" y="386" class="small">identity</text>
  <path class="identity" d="M403 262 C440 355 545 410 593 505"/>
  <text x="490" y="386" class="small">identity</text>
  <path class="identity" d="M793 262 C770 350 742 410 723 505"/>
  <text x="760" y="386" class="small">identity</text>
  <path class="identity" d="M923 262 C900 350 872 410 853 505"/>
  <text x="890" y="386" class="small">identity</text>

  <rect x="70" y="692" width="22" height="14" class="premise" rx="3"/>
  <text x="100" y="704" class="small">semantic node</text>
  <rect x="230" y="692" width="22" height="14" class="logic" rx="3"/>
  <text x="260" y="704" class="small">logic/scope node</text>
  <rect x="410" y="692" width="22" height="14" class="temporal-node" rx="3"/>
  <text x="440" y="704" class="small">temporal node</text>
  <line x1="590" y1="699" x2="635" y2="699" class="identity"/>
  <text x="646" y="704" class="small">cross-sentence identity</text>
  <line x1="830" y1="699" x2="875" y2="699" class="scope"/>
  <text x="886" y="704" class="small">scope edge</text>
</svg>
