<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 14px Arial, sans-serif; fill: #42526a; }
      .label { font: 13px Arial, sans-serif; fill: #172033; }
      .small { font: 12px Arial, sans-serif; fill: #42526a; }
      .panel { fill: #fbfcfe; stroke: #d8dee9; stroke-width: 1.5; rx: 10; }
      .textnode { fill: #e8f1ff; stroke: #2f80ed; stroke-width: 2; }
      .hypnode { fill: #e9f8ef; stroke: #27ae60; stroke-width: 2; }
      .wikinode { fill: #fff7df; stroke: #f2a900; stroke-width: 2; }
      .typenode { fill: #f4ecff; stroke: #9b51e0; stroke-width: 2; }
      .edge { stroke: #8a94a6; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .same { stroke: #2f80ed; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .wiki { stroke: #f2a900; stroke-width: 2.5; fill: none; marker-end: url(#arrow-gold); }
      .type { stroke: #9b51e0; stroke-width: 2.5; fill: none; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8a94a6"/></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2f80ed"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f2a900"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9b51e0"/></marker>
  </defs>

  <rect x="20" y="20" width="1140" height="720" fill="#ffffff" rx="14"/>
  <text x="50" y="62" class="title">DiGE-NLI v4: Example Wikidata Entity Evidence Graph</text>
  <text x="50" y="90" class="subtitle">Premise: “Barack Obama was born in Hawaii.”</text>
  <text x="50" y="112" class="subtitle">Hypothesis: “Obama was born in the United States.”</text>

  <rect x="50" y="145" width="1080" height="170" class="panel"/>
  <text x="72" y="178" class="label">Text anchors</text>

  <rect x="120" y="220" width="140" height="46" class="textnode" rx="8"/>
  <text x="190" y="248" text-anchor="middle" class="label">Barack Obama</text>
  <text x="190" y="284" text-anchor="middle" class="small">premise entity span</text>

  <rect x="350" y="220" width="100" height="46" class="textnode" rx="8"/>
  <text x="400" y="248" text-anchor="middle" class="label">Hawaii</text>
  <text x="400" y="284" text-anchor="middle" class="small">premise location</text>

  <rect x="600" y="220" width="100" height="46" class="hypnode" rx="8"/>
  <text x="650" y="248" text-anchor="middle" class="label">Obama</text>
  <text x="650" y="284" text-anchor="middle" class="small">hypothesis alias</text>

  <rect x="790" y="220" width="150" height="46" class="hypnode" rx="8"/>
  <text x="865" y="248" text-anchor="middle" class="label">United States</text>
  <text x="865" y="284" text-anchor="middle" class="small">hypothesis location</text>

  <rect x="50" y="360" width="1080" height="235" class="panel"/>
  <text x="72" y="393" class="label">Wikidata evidence nodes</text>

  <rect x="110" y="435" width="160" height="52" class="wikinode" rx="8"/>
  <text x="190" y="458" text-anchor="middle" class="label">Q76 Barack Obama</text>
  <text x="190" y="478" text-anchor="middle" class="small">former U.S. president</text>

  <rect x="340" y="435" width="130" height="52" class="wikinode" rx="8"/>
  <text x="405" y="458" text-anchor="middle" class="label">Q782 Hawaii</text>
  <text x="405" y="478" text-anchor="middle" class="small">U.S. state</text>

  <rect x="560" y="435" width="170" height="52" class="wikinode" rx="8"/>
  <text x="645" y="458" text-anchor="middle" class="label">Q30 United States</text>
  <text x="645" y="478" text-anchor="middle" class="small">country</text>

  <rect x="830" y="435" width="120" height="52" class="typenode" rx="8"/>
  <text x="890" y="458" text-anchor="middle" class="label">human</text>
  <text x="890" y="478" text-anchor="middle" class="small">instance_of</text>

  <rect x="980" y="435" width="100" height="52" class="typenode" rx="8"/>
  <text x="1030" y="458" text-anchor="middle" class="label">country</text>
  <text x="1030" y="478" text-anchor="middle" class="small">instance_of</text>

  <path class="wiki" d="M190 266 C190 325 190 375 190 435"/>
  <text x="205" y="348" class="small">entity_link</text>
  <path class="wiki" d="M400 266 C405 325 405 375 405 435"/>
  <text x="420" y="348" class="small">entity_link</text>
  <path class="wiki" d="M650 266 C645 325 645 375 645 435"/>
  <text x="662" y="348" class="small">entity_link</text>
  <path class="wiki" d="M865 266 C775 330 700 375 645 435"/>
  <text x="780" y="350" class="small">entity_link</text>

  <path class="same" d="M260 243 C365 170 525 170 600 243"/>
  <text x="405" y="178" class="small">wikidata_same_entity / alias evidence</text>

  <path class="type" d="M270 461 C470 370 700 370 830 461"/>
  <text x="520" y="385" class="small">instance_of</text>
  <path class="type" d="M730 461 C820 390 940 390 980 461"/>
  <text x="835" y="404" class="small">instance_of</text>

  <rect x="80" y="640" width="22" height="14" class="textnode" rx="3"/>
  <text x="110" y="652" class="small">text span</text>
  <rect x="220" y="640" width="22" height="14" class="wikinode" rx="3"/>
  <text x="250" y="652" class="small">Wikidata entity</text>
  <rect x="390" y="640" width="22" height="14" class="typenode" rx="3"/>
  <text x="420" y="652" class="small">entity type</text>
  <line x1="560" y1="647" x2="610" y2="647" class="same"/>
  <text x="622" y="652" class="small">same entity / alias</text>
  <line x1="790" y1="647" x2="840" y2="647" class="type"/>
  <text x="852" y="652" class="small">instance/type evidence</text>
</svg>
