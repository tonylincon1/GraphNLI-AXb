data_dir: data
output_dir: runs

# Experiment 0010: replication of experiment_0008 (coverage_pl_v1 vs. pair_cls) in English.
#
# Why: InferBR is close to saturation for BERT-base (pair_cls 0.918, 10-seed vote
# 0.926). MultiNLI/XNLI-en leaves more headroom (BERT-base ~84%) and tests whether the
# COVER-PL gain (fewer contradiction -> entailment errors) carries over to another
# language and a harder, multi-genre dataset.
#
# Protocol (same as 0008 except where noted):
# * Encoder: bert-base-uncased (English BERT-base, the counterpart of BERTimbau-base).
# * Train: a fixed, label-stratified 50k subset of MultiNLI train (sample_seed 13), the
#   SAME subset for every seed, so runs stay paired. Full MNLI (393k) would take
#   ~7 h per COVER epoch on the GTX 1080 Ti.
# * Validation (checkpoint selection): XNLI dev, English (2,490).
# * Test: XNLI test English (5,010) + MNLI dev matched (9,815) and mismatched (9,832).
# * Lexicon for the token graph: WordNet 3.0 + Wiktionary-EN (the English counterpart
#   of PT-LKB + Wiktionary-PT). Build WordNet once with
#     poetry run python scripts/export_wordnet_relations.py
#   pt_lkb_cache is cleared so no Portuguese relations leak into English runs.
# * Same fixed hyperparameters as 0008 (tuning disabled); max_len 128 (standard for
#   MNLI); 4 epochs, patience 2 (50k examples converge faster than InferBR's 8k).
# * 10 paired seeds -> Wilcoxon / Friedman-Nemenyi as in 0008.
model_name: bert-base-uncased
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]

training:
  epochs: 4
  batch_size: 32
  lr: 0.0000204
  weight_decay: 0.00035
  warmup_ratio: 0.0275
  dropout: 0.103
  max_len: 128
  max_nodes: 32
  max_node_len: 8
  max_wikidata_entities: 8
  max_wikidata_len: 32
  max_proof_nodes: 12
  max_proof_len: 32
  max_logicpath_nodes: 32
  max_logicpath_len: 24
  wikidata_cache: data/cache/wikidata_entities.jsonl
  wiktionary_cache: data/cache/wiktionary_entries_mnli.jsonl
  wordnet_cache: data/cache/wordnet_relations_en.jsonl
  pt_lkb_cache: ""
  max_wiktionary_entries: 2
  graph_layers: 2
  aux_weight: 0.15
  graph_lr_multiplier: 10.0
  partial_label_datasets: []
  selection_metric: nli3/macro_f1
  patience: 2
  cd_metric: binary/mcc
  cd_alpha: 0.05
  num_workers: 0
  device: cuda
  max_grad_norm: 1.0

tuning:
  enabled: false
  selection_metric: nli3/macro_f1

pipelines:
  mnli_en:
    enabled: true
    device: cuda
    batch_size: 32
    model_names: [bert-base-uncased]
    variants: [coverage_pl_v1, pair_cls]
    train:
      datasets:
        - {dataset: mnli, split: train, limit: 50000, sample_seed: 13}
    validation:
      datasets:
        - {dataset: xnli, split: dev, languages: [en]}
    test:
      - {name: xnli_test_en, dataset: xnli, split: test, languages: [en]}
      - {name: mnli_dev_matched, dataset: mnli, split: dev_matched}
      - {name: mnli_dev_mismatched, dataset: mnli, split: dev_mismatched}
    save_explanations: false
